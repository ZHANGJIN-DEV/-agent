[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pano-agent"
version = "0.0.1"
description = "PanoDirector: 360° 全景视频自动运镜 Agent —— 自然语言驱动的全景视频理解与虚拟相机轨迹生成"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "张金" }]
keywords = ["360-video", "equirectangular", "auto-framing", "llm-agent", "computer-vision"]

# 注意：torch / torchvision 不在此声明。
# 它们需要从 CUDA 专用 index 安装，见 requirements.txt 与 README 的环境搭建章节。
dependencies = [
    "numpy<2.3",
    "opencv-python>=4.10,<4.12",
    "scipy>=1.13",
    "pillow>=10.3",
    "pyyaml>=6.0",
    # 球面几何
    "py360convert>=1.0.0",
    "einops>=0.8",
    # 跟踪（球面 Kalman + 匈牙利关联）
    "filterpy>=1.4.5",
    "lap>=0.4.0",
    # 感知
    "ultralytics>=8.3,<8.4",
    "timm>=1.0",
    # 视频 IO
    "av>=13.0",
    "imageio-ffmpeg>=0.5",
    "librosa>=0.10",
    "soundfile>=0.12",
    # 配置与数据模型
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # LLM / VLM 客户端
    "httpx>=0.27",
    "tenacity>=8.4",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# 服务层（W11 用）
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
# 端侧导出（W11 加分项）
export = [
    "onnx>=1.16",
    "onnxruntime-gpu>=1.18",
]
# 开发工具
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
pano = "pano_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: 需要 CUDA 的测试（默认跳过，用 -m gpu 启用）",
    "slow: 耗时较长的测试",
    "network: 需要访问 API 的测试（CI 中跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # 行长由 formatter 处理
    "N806",  # 允许数学公式风格的局部大写变量（R, K, M 等矩阵）
    "N803",  # 允许数学风格的参数名
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]

[tool.coverage.run]
source = ["src/pano_agent"]
omit = ["*/providers/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
